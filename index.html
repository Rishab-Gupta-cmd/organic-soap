<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rudra Organics | Handcrafted Organic Soaps</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          forest: '#1b4332', moss: '#2d6a4f', sage: '#74c69d',
          mint: '#d8f3dc', cream: '#fdf8ef', earth: '#b08968', clay: '#e8d5b7'
        },
        fontFamily: {
          display: ['"Playfair Display"', 'serif'],
          body: ['Poppins', 'sans-serif']
        }
      }
    }
  }
</script>
<style>
  body { font-family: 'Poppins', sans-serif; background: #fdf8ef; }
  .font-display { font-family: 'Playfair Display', serif; }

  @keyframes floaty { 0%,100% { transform: translateY(0) rotate(0deg);} 50% { transform: translateY(-18px) rotate(6deg);} }
  @keyframes floaty2 { 0%,100% { transform: translateY(0) rotate(0deg);} 50% { transform: translateY(14px) rotate(-8deg);} }
  @keyframes blob { 0%,100%{border-radius:60% 40% 55% 45%/55% 45% 60% 40%;} 50%{border-radius:45% 55% 40% 60%/40% 60% 45% 55%;} }
  @keyframes fadeUp { from {opacity:0; transform:translateY(30px);} to {opacity:1; transform:translateY(0);} }
  @keyframes shimmer { 0%{background-position:-400px 0;} 100%{background-position:400px 0;} }
  @keyframes pop { 0%{transform:scale(0.6);opacity:0;} 80%{transform:scale(1.08);} 100%{transform:scale(1);opacity:1;} }

  .leaf-float { animation: floaty 7s ease-in-out infinite; }
  .leaf-float2 { animation: floaty2 9s ease-in-out infinite; }
  .blob { animation: blob 10s ease-in-out infinite; }
  .fade-up { animation: fadeUp .8s ease both; }
  .pop-in { animation: pop .4s ease both; }

  .card-tilt { transition: transform .4s ease, box-shadow .4s ease; }
  .card-tilt:hover { transform: translateY(-10px) rotate(-1deg) scale(1.02); box-shadow: 0 30px 60px -20px rgba(27,67,50,.35); }

  .btn-organic { transition: all .3s ease; }
  .btn-organic:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -8px rgba(45,106,79,.5); }
  .btn-organic:active { transform: scale(.96); }

  .texture {
    background-image: radial-gradient(rgba(45,106,79,.07) 1.5px, transparent 1.5px);
    background-size: 26px 26px;
  }
  .hero-grad { background: linear-gradient(135deg, #d8f3dc 0%, #fdf8ef 45%, #e8d5b7 100%); }

  .marquee { display:flex; gap:3rem; white-space:nowrap; animation: scrollx 22s linear infinite; }
  @keyframes scrollx { from{transform:translateX(0);} to{transform:translateX(-50%);} }

  input, textarea, select { outline: none; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #74c69d; border-radius: 8px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo } = React;

/* ====== CONFIG ====== */
const FORMSPREE = "https://formspree.io/f/mlgkgebq";
const INSTAGRAM_LINK = "#"; /* <-- paste your Instagram URL here later */
const SOAP_PRICE = 130;
const DELIVERY_FEE = 50;   /* per order, all payment modes */
const COD_FEE = 50;        /* extra, only for COD */

const SOAPS = [
  { id: "rose",    name: "Rose Bliss",      img: "rose.jpeg",    tag: "Glow & Hydrate",  desc: "Hand-poured with real rose petals for soft, romantic, glowing skin.", emoji: "🌹" },
  { id: "neem",    name: "Neem Pure",       img: "neem.jpeg",    tag: "Anti-Bacterial",  desc: "Nature's antiseptic. Fights acne and keeps skin clean and calm.", emoji: "🍃" },
  { id: "lemon",   name: "Lemon Fresh",     img: "lemon.jpeg",   tag: "Brighten & Zest", desc: "Zesty citrus burst that brightens dull skin and energises your day.", emoji: "🍋" },
  { id: "multani", name: "Multani Earth",   img: "multani.jpeg", tag: "Deep Cleanse",    desc: "Classic multani mitti pulls out impurities for a fresh matte feel.", emoji: "🪨" },
  { id: "dtan",    name: "D-Tan Detox",     img: "dtan.jpeg",    tag: "Tan Removal",     desc: "Gently lifts sun tan and revives your skin's natural radiance.", emoji: "☀️" },
];

/* ====== SMALL COMPONENTS ====== */
function Leaf({ className }) {
  return <div className={"pointer-events-none select-none absolute text-4xl md:text-6xl opacity-30 " + className}>🌿</div>;
}

function SectionTitle({ kicker, title }) {
  return (
    <div className="text-center mb-12 fade-up">
      <p className="uppercase tracking-[0.3em] text-moss font-semibold text-sm mb-2">{kicker}</p>
      <h2 className="font-display text-4xl md:text-5xl text-forest">{title}</h2>
      <div className="mx-auto mt-4 h-1 w-24 rounded-full bg-gradient-to-r from-sage to-earth"></div>
    </div>
  );
}

/* ====== APP ====== */
function App() {
  const [cart, setCart] = useState({});           // { soapId: qty }
  const [cartOpen, setCartOpen] = useState(false);
  const [checkoutOpen, setCheckoutOpen] = useState(false);

  const addToCart = (id) => { setCart(c => ({ ...c, [id]: (c[id] || 0) + 1 })); setCartOpen(true); };
  const setQty = (id, qty) => setCart(c => {
    const n = { ...c };
    if (qty <= 0) delete n[id]; else n[id] = qty;
    return n;
  });

  const totalItems = Object.values(cart).reduce((a, b) => a + b, 0);
  const subtotal = totalItems * SOAP_PRICE;

  return (
    <div className="texture min-h-screen overflow-x-hidden">
      <Navbar count={totalItems} onCart={() => setCartOpen(true)} />
      <Hero />
      <Marquee />
      <Products onAdd={addToCart} />
      <Why />
      <Contact />
      <Footer />

      {cartOpen && (
        <CartDrawer cart={cart} setQty={setQty} subtotal={subtotal}
          onClose={() => setCartOpen(false)}
          onCheckout={() => { setCartOpen(false); setCheckoutOpen(true); }} />
      )}
      {checkoutOpen && (
        <Checkout cart={cart} subtotal={subtotal} totalItems={totalItems}
          onClose={() => setCheckoutOpen(false)}
          onDone={() => setCart({})} />
      )}
    </div>
  );
}

/* ====== NAVBAR ====== */
function Navbar({ count, onCart }) {
  return (
    <nav className="sticky top-0 z-40 backdrop-blur-lg bg-cream/80 border-b border-sage/30">
      <div className="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between">
        <a href="#" className="flex items-center gap-2">
          <span className="text-3xl">🧼</span>
          <span className="font-display text-2xl text-forest font-bold">Rudra <span className="text-moss">Organics</span></span>
        </a>
        <div className="hidden md:flex gap-8 font-medium text-forest/80">
          <a href="#shop" className="hover:text-moss transition">Shop</a>
          <a href="#why" className="hover:text-moss transition">Why Us</a>
          <a href="#contact" className="hover:text-moss transition">Contact</a>
        </div>
        <button onClick={onCart} className="btn-organic relative bg-moss text-white px-5 py-2.5 rounded-full font-medium flex items-center gap-2">
          🛒 Cart
          {count > 0 && <span className="pop-in absolute -top-2 -right-2 bg-earth text-white text-xs w-6 h-6 rounded-full flex items-center justify-center font-bold">{count}</span>}
        </button>
      </div>
    </nav>
  );
}

/* ====== HERO ====== */
function Hero() {
  return (
    <header className="hero-grad relative overflow-hidden">
      <Leaf className="leaf-float top-16 left-8" />
      <Leaf className="leaf-float2 top-40 right-12" />
      <Leaf className="leaf-float bottom-10 left-1/3 text-3xl" />
      <div className="absolute -top-24 -right-24 w-96 h-96 bg-sage/30 blob"></div>
      <div className="absolute -bottom-32 -left-20 w-80 h-80 bg-earth/20 blob"></div>

      <div className="max-w-6xl mx-auto px-5 py-24 md:py-32 grid md:grid-cols-2 gap-12 items-center relative">
        <div className="fade-up">
          <span className="inline-block bg-white/70 backdrop-blur px-4 py-1.5 rounded-full text-moss font-semibold text-sm mb-6 shadow">
            🌱 100% Handmade • Chemical Free
          </span>
          <h1 className="font-display text-5xl md:text-7xl text-forest leading-tight mb-6">
            Nature's Touch,<br /><span className="text-moss italic">Bottled in a Bar.</span>
          </h1>
          <p className="text-forest/70 text-lg mb-8 max-w-md">
            Five handcrafted organic soaps made with love, herbs and zero nasties. Your skin deserves the real thing.
          </p>
          <div className="flex flex-wrap gap-4">
            <a href="#shop" className="btn-organic bg-forest text-white px-8 py-4 rounded-full font-semibold text-lg">Shop Soaps → ₹130 each</a>
            <a href="#why" className="btn-organic bg-white/80 backdrop-blur text-forest px-8 py-4 rounded-full font-semibold text-lg border border-sage">Why Organic?</a>
          </div>
        </div>
        <div className="relative fade-up" style={{animationDelay:'.2s'}}>
          <div className="bg-white/60 backdrop-blur rounded-[3rem] p-4 shadow-2xl rotate-2 card-tilt">
            <img src="rose.jpeg" alt="Rudra Organics handcrafted soap" className="rounded-[2.5rem] w-full h-80 md:h-96 object-cover" />
          </div>
          <div className="absolute -bottom-6 -left-6 bg-white rounded-2xl shadow-xl px-5 py-3 flex items-center gap-3 pop-in">
            <span className="text-3xl">⭐</span>
            <div><p className="font-bold text-forest">Loved by skin,</p><p className="text-sm text-forest/60">trusted by nature</p></div>
          </div>
        </div>
      </div>
    </header>
  );
}

/* ====== MARQUEE ====== */
function Marquee() {
  const items = ["🌿 No Parabens", "🐰 Cruelty Free", "🧴 No Sulphates", "🌸 Real Botanicals", "🤲 Handmade in Small Batches", "♻️ Eco Packaging"];
  const row = [...items, ...items];
  return (
    <div className="bg-forest text-mint py-3 overflow-hidden">
      <div className="marquee font-medium tracking-wide">
        {row.map((t, i) => <span key={i}>{t}</span>)}
      </div>
    </div>
  );
}

/* ====== PRODUCTS ====== */
function Products({ onAdd }) {
  return (
    <section id="shop" className="max-w-6xl mx-auto px-5 py-24">
      <SectionTitle kicker="Our Collection" title="Five Bars of Pure Goodness" />
      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-8">
        {SOAPS.map((s, i) => (
          <div key={s.id} className="card-tilt bg-white rounded-3xl overflow-hidden shadow-lg fade-up" style={{animationDelay: (i * .1) + 's'}}>
            <div className="relative">
              <img src={s.img} alt={s.name + " organic soap"} className="w-full h-56 object-cover" />
              <span className="absolute top-4 left-4 bg-cream/90 backdrop-blur text-moss text-xs font-bold px-3 py-1.5 rounded-full">{s.tag}</span>
              <span className="absolute -bottom-5 right-5 text-4xl bg-white rounded-full p-2 shadow-lg">{s.emoji}</span>
            </div>
            <div className="p-6 pt-8">
              <h3 className="font-display text-2xl text-forest mb-2">{s.name}</h3>
              <p className="text-forest/60 text-sm mb-5">{s.desc}</p>
              <div className="flex items-center justify-between">
                <p className="text-2xl font-bold text-moss">₹{SOAP_PRICE}</p>
                <button onClick={() => onAdd(s.id)} className="btn-organic bg-moss text-white px-5 py-2.5 rounded-full font-semibold">Add to Cart +</button>
              </div>
            </div>
          </div>
        ))}
      </div>
    </section>
  );
}

/* ====== WHY ====== */
function Why() {
  const points = [
    { icon: "🌱", t: "Truly Organic", d: "Cold-processed with herbs, clays and essential oils. Nothing artificial, ever." },
    { icon: "🤲", t: "Handmade Batches", d: "Every bar is hand-poured and cured slowly for a rich, creamy lather." },
    { icon: "🚚", t: "Delivered to You", d: "Flat ₹50 delivery anywhere, pay online via UPI or Cash on Delivery." },
    { icon: "💚", t: "Skin First", d: "Gentle on all skin types. Free from parabens, sulphates and cruelty." },
  ];
  return (
    <section id="why" className="bg-mint/50 py-24 relative overflow-hidden">
      <Leaf className="leaf-float2 top-10 right-10" />
      <div className="max-w-6xl mx-auto px-5">
        <SectionTitle kicker="The Rudra Promise" title="Why Choose Rudra Organics?" />
        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
          {points.map((p, i) => (
            <div key={i} className="bg-white/80 backdrop-blur rounded-3xl p-7 text-center shadow card-tilt fade-up" style={{animationDelay:(i*.1)+'s'}}>
              <div className="text-5xl mb-4">{p.icon}</div>
              <h3 className="font-display text-xl text-forest mb-2">{p.t}</h3>
              <p className="text-forest/60 text-sm">{p.d}</p>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ====== CART DRAWER ====== */
function CartDrawer({ cart, setQty, subtotal, onClose, onCheckout }) {
  const ids = Object.keys(cart);
  return (
    <div className="fixed inset-0 z-50 flex justify-end">
      <div className="absolute inset-0 bg-forest/40 backdrop-blur-sm" onClick={onClose}></div>
      <div className="relative w-full max-w-md bg-cream h-full shadow-2xl p-6 overflow-y-auto pop-in">
        <div className="flex justify-between items-center mb-6">
          <h3 className="font-display text-3xl text-forest">Your Cart 🛒</h3>
          <button onClick={onClose} className="text-2xl text-forest/60 hover:text-forest">✕</button>
        </div>
        {ids.length === 0 ? (
          <div className="text-center py-20">
            <p className="text-6xl mb-4">🧺</p>
            <p className="text-forest/60">Your basket is empty. Add some goodness!</p>
          </div>
        ) : (
          <React.Fragment>
            {ids.map(id => {
              const s = SOAPS.find(x => x.id === id);
              return (
                <div key={id} className="flex items-center gap-4 bg-white rounded-2xl p-3 mb-3 shadow">
                  <img src={s.img} alt={s.name} className="w-16 h-16 rounded-xl object-cover" />
                  <div className="flex-1">
                    <p className="font-semibold text-forest">{s.name}</p>
                    <p className="text-sm text-moss font-bold">₹{SOAP_PRICE} × {cart[id]} = ₹{SOAP_PRICE * cart[id]}</p>
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={() => setQty(id, cart[id] - 1)} className="w-8 h-8 rounded-full bg-mint text-forest font-bold">−</button>
                    <span className="w-6 text-center font-bold text-forest">{cart[id]}</span>
                    <button onClick={() => setQty(id, cart[id] + 1)} className="w-8 h-8 rounded-full bg-moss text-white font-bold">+</button>
                  </div>
                </div>
              );
            })}
            <div className="bg-white rounded-2xl p-5 mt-6 shadow space-y-2 text-forest">
              <div className="flex justify-between"><span>Subtotal</span><b>₹{subtotal}</b></div>
              <div className="flex justify-between"><span>Delivery</span><b>₹{DELIVERY_FEE}</b></div>
              <div className="flex justify-between text-sm text-forest/50"><span>COD fee (if chosen)</span><span>+₹{COD_FEE}</span></div>
              <div className="border-t border-sage/40 pt-2 flex justify-between text-lg"><span>Payable (UPI)</span><b className="text-moss">₹{subtotal + DELIVERY_FEE}</b></div>
            </div>
            <button onClick={onCheckout} className="btn-organic w-full mt-6 bg-forest text-white py-4 rounded-full font-bold text-lg">Proceed to Checkout →</button>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

/* ====== CHECKOUT ====== */
function Checkout({ cart, subtotal, totalItems, onClose, onDone }) {
  const [form, setForm] = useState({ name: "", email: "", phone: "", address: "", payment: "UPI" });
  const [status, setStatus] = useState("idle"); // idle | sending | success | error

  const codFee = form.payment === "COD" ? COD_FEE : 0;
  const total = subtotal + DELIVERY_FEE + codFee;

  const itemsSummary = Object.keys(cart).map(id => {
    const s = SOAPS.find(x => x.id === id);
    return `${s.name} x${cart[id]} (₹${SOAP_PRICE * cart[id]})`;
  }).join(", ");

  const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));

  const submit = async (e) => {
    e.preventDefault();
    if (totalItems === 0) return;
    setStatus("sending");
    try {
      const res = await fetch(FORMSPREE, {
        method: "POST",
        headers: { "Accept": "application/json", "Content-Type": "application/json" },
        body: JSON.stringify({
          formType: "ORDER",
          name: form.name, email: form.email, phone: form.phone, address: form.address,
          paymentMode: form.payment,
          items: itemsSummary,
          totalQty: totalItems,
          subtotal: "₹" + subtotal,
          deliveryFee: "₹" + DELIVERY_FEE,
          codFee: "₹" + codFee,
          finalAmount: "₹" + total,
        })
      });
      if (res.ok) { setStatus("success"); onDone(); }
      else setStatus("error");
    } catch { setStatus("error"); }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
      <div className="absolute inset-0 bg-forest/50 backdrop-blur-sm" onClick={onClose}></div>
      <div className="relative bg-cream rounded-3xl shadow-2xl w-full max-w-2xl max-h-[92vh] overflow-y-auto p-7 pop-in">
        <button onClick={onClose} className="absolute top-5 right-5 text-2xl text-forest/60 hover:text-forest">✕</button>

        {status === "success" ? (
          <div className="text-center py-16 fade-up">
            <p className="text-7xl mb-6">🎉</p>
            <h3 className="font-display text-3xl text-forest mb-3">Order Placed!</h3>
            <p className="text-forest/70 max-w-sm mx-auto">
              Thank you for choosing <b>Rudra Organics</b>. We will be contacting you shortly to confirm your order. 💚
            </p>
            <button onClick={onClose} className="btn-organic mt-8 bg-moss text-white px-8 py-3 rounded-full font-semibold">Continue Shopping</button>
          </div>
        ) : (
          <React.Fragment>
            <h3 className="font-display text-3xl text-forest mb-1">Checkout 🌿</h3>
            <p className="text-forest/60 mb-6 text-sm">Fill your details and we'll get your soaps on the way.</p>

            <form onSubmit={submit} className="grid md:grid-cols-2 gap-6">
              {/* details */}
              <div className="space-y-4">
                <input required value={form.name} onChange={set("name")} placeholder="Full Name" className="w-full bg-white rounded-xl px-4 py-3 border border-sage/40 focus:border-moss" />
                <input required type="email" value={form.email} onChange={set("email")} placeholder="Email Address" className="w-full bg-white rounded-xl px-4 py-3 border border-sage/40 focus:border-moss" />
                <input required type="tel" pattern="[0-9]{10}" value={form.phone} onChange={set("phone")} placeholder="Mobile Number (10 digits)" className="w-full bg-white rounded-xl px-4 py-3 border border-sage/40 focus:border-moss" />
                <textarea required value={form.address} onChange={set("address")} placeholder="Full Delivery Address with Pincode" rows="4" className="w-full bg-white rounded-xl px-4 py-3 border border-sage/40 focus:border-moss"></textarea>

                <div>
                  <p className="font-semibold text-forest mb-2">Payment Mode</p>
                  <div className="flex gap-3">
                    {["UPI", "COD"].map(m => (
                      <label key={m} className={"flex-1 cursor-pointer rounded-xl border-2 px-4 py-3 text-center font-semibold transition " +
                        (form.payment === m ? "border-moss bg-mint text-forest" : "border-sage/40 bg-white text-forest/60")}>
                        <input type="radio" name="payment" value={m} checked={form.payment === m} onChange={set("payment")} className="hidden" />
                        {m === "UPI" ? "📱 UPI" : "💵 COD (+₹" + COD_FEE + ")"}
                      </label>
                    ))}
                  </div>
                </div>

                {form.payment === "UPI" && (
                  <div className="bg-white rounded-2xl p-4 text-center border border-sage/40 pop-in">
                    <p className="font-semibold text-forest mb-2">Scan & Pay ₹{total}</p>
                    <img src="upi-qr.jpeg" alt="UPI QR Code" className="w-44 h-44 object-contain mx-auto rounded-xl" />
                    <p className="text-xs text-forest/50 mt-2">Pay the final amount, then place your order. We'll verify and confirm.</p>
                  </div>
                )}
              </div>

              {/* summary */}
              <div>
                <div className="bg-white rounded-2xl p-5 shadow space-y-3 sticky top-0">
                  <h4 className="font-display text-xl text-forest">Order Summary</h4>
                  {Object.keys(cart).map(id => {
                    const s = SOAPS.find(x => x.id === id);
                    return (
                      <div key={id} className="flex justify-between text-sm text-forest/80">
                        <span>{s.emoji} {s.name} × {cart[id]}</span><b>₹{SOAP_PRICE * cart[id]}</b>
                      </div>
                    );
                  })}
                  <div className="border-t border-sage/40 pt-3 space-y-2 text-forest">
                    <div className="flex justify-between"><span>Subtotal ({totalItems} items)</span><b>₹{subtotal}</b></div>
                    <div className="flex justify-between"><span>Delivery Charges</span><b>₹{DELIVERY_FEE}</b></div>
                    {codFee > 0 && <div className="flex justify-between text-earth"><span>COD Charges</span><b>+₹{codFee}</b></div>}
                    <div className="flex justify-between text-xl border-t border-sage/40 pt-3">
                      <span className="font-display">Final Amount</span><b className="text-moss">₹{total}</b>
                    </div>
                  </div>
                  <button type="submit" disabled={status === "sending" || totalItems === 0}
                    className="btn-organic w-full bg-forest text-white py-4 rounded-full font-bold text-lg disabled:opacity-50">
                    {status === "sending" ? "Placing Order..." : "Place Order • ₹" + total}
                  </button>
                  {status === "error" && <p className="text-red-600 text-sm text-center">Something went wrong. Please try again.</p>}
                  {totalItems === 0 && <p className="text-forest/50 text-sm text-center">Your cart is empty.</p>}
                </div>
              </div>
            </form>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

/* ====== CONTACT ====== */
function Contact() {
  const [form, setForm] = useState({ name: "", phone: "" });
  const [status, setStatus] = useState("idle");

  const submit = async (e) => {
    e.preventDefault();
    setStatus("sending");
    try {
      const res = await fetch(FORMSPREE, {
        method: "POST",
        headers: { "Accept": "application/json", "Content-Type": "application/json" },
        body: JSON.stringify({ formType: "CONTACT", name: form.name, phone: form.phone })
      });
      setStatus(res.ok ? "success" : "error");
    } catch { setStatus("error"); }
  };

  return (
    <section id="contact" className="py-24 relative overflow-hidden">
      <Leaf className="leaf-float bottom-8 left-8" />
      <div className="max-w-3xl mx-auto px-5">
        <SectionTitle kicker="Say Hello" title="Contact Us" />
        <div className="bg-white rounded-3xl shadow-xl p-8 md:p-10">
          {status === "success" ? (
            <div className="text-center py-10 pop-in">
              <p className="text-6xl mb-4">🙏</p>
              <h3 className="font-display text-2xl text-forest mb-2">Thank You!</h3>
              <p className="text-forest/70">We will be contacting you shortly. 💚</p>
            </div>
          ) : (
            <form onSubmit={submit} className="space-y-4">
              <p className="text-forest/70 text-center mb-2">Questions about our soaps? Drop your details and we'll call you back.</p>
              <input required value={form.name} onChange={e => setForm(f => ({...f, name: e.target.value}))} placeholder="Your Name" className="w-full bg-cream rounded-xl px-4 py-3 border border-sage/40 focus:border-moss" />
              <input required type="tel" pattern="[0-9]{10}" value={form.phone} onChange={e => setForm(f => ({...f, phone: e.target.value}))} placeholder="Mobile Number (10 digits)" className="w-full bg-cream rounded-xl px-4 py-3 border border-sage/40 focus:border-moss" />
              <button type="submit" disabled={status === "sending"} className="btn-organic w-full bg-moss text-white py-4 rounded-full font-bold text-lg disabled:opacity-50">
                {status === "sending" ? "Sending..." : "Request a Callback 📞"}
              </button>
              {status === "error" && <p className="text-red-600 text-sm text-center">Something went wrong. Please try again.</p>}
            </form>
          )}
        </div>
      </div>
    </section>
  );
}

/* ====== FOOTER ====== */
function Footer() {
  return (
    <footer className="bg-forest text-mint py-12">
      <div className="max-w-6xl mx-auto px-5 text-center space-y-5">
        <p className="font-display text-3xl">🧼 Rudra Organics</p>
        <p className="text-mint/70 max-w-md mx-auto text-sm">Handcrafted organic soaps made with love, herbs and honesty.</p>
        <a href={INSTAGRAM_LINK} target="_blank" rel="noopener noreferrer"
          className="btn-organic inline-flex items-center gap-2 bg-gradient-to-r from-pink-500 to-orange-400 text-white px-6 py-3 rounded-full font-semibold">
          📸 Follow us on Instagram
        </a>
        <p className="text-mint/50 text-sm pt-4 border-t border-mint/20">
          © {new Date().getFullYear()} Rudra Organics. All Rights Reserved.
        </p>
      </div>
    </footer>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
